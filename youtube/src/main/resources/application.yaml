spring:
  application:
    name: youtube
  rabbitmq:
    username: ${RABBIT_USERNAME}
    password: ${RABBIT_PASSWORD}
    host: ${RABBIT_HOST:rabbitmq}
    port: ${RABBIT_PORT:5672}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  buckets:
    - raw-uploads
    - media-output

rabbit:
  exchange:
    name: youtube_exchange
  queues:
    published:
      name: youtube_published_queue
      routing-key: "youtube-video-published"

rabbit-listener:
  queue:
    name: youtube_upload_queue

auth:
  service:
    url: http://auth:8080

internal:
  client-id: youtube-service
  secret: ${SERVICE_YOUTUBE_SECRET}


