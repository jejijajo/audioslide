spring:
  application:
    name: auth
  security:
    oauth2:
      client:
        registration:
          google:
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/youtube.upload
            authorization-grant-type: authorization_code
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


jwt:
  secret: ${JWT_SECRET}
  access-token-ttl: 900000    #ms
  refresh-token-ttl: 604800000