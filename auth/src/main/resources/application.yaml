spring:
  application:
    name: auth
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/youtube.upload
              - https://www.googleapis.com/auth/youtube.readonly
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8085/login/oauth2/code/{registrationId}"
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  frontend:
    callback-url: ${FRONTEND_CALLBACK_URL:http://localhost:5173/auth/callback}

server:
  forward-headers-strategy: framework

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
  access-token-ttl: 900000
  refresh-token-ttl: 604800000

internal:
  clients:
    youtube-service:
      secret: ${SERVICE_YOUTUBE_SECRET}
      scopes: internal.users.read

security:
  encryption:
    key: ${GOOGLE_TOKEN_ENC_KEY}
    salt: ${GOOGLE_TOKEN_ENC_SALT}