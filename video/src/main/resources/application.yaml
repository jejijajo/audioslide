spring:
  application:
    name: video
  rabbitmq:
    username: ${RABBIT_USERNAME}
    password: ${RABBIT_PASSWORD}
    host: ${RABBIT_HOST:rabbitmq}
    port: ${RABBIT_PORT:5672}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  buckets:
    - raw-uploads
    - media-output

rabbit-listener:
  queue:
    name: upload_queue
