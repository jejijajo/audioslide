server:
  forward-headers-strategy: framework
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-login
              uri: http://auth:8080
              predicates:
                - Path=/login, /oauth2/authorization/**, /login/oauth2/code/**

            - id: upload-upload
              uri: http://upload:8080
              predicates:
                - Path=/upload
              filters:
                - SetPath=/api/upload

            - id: template-create
              uri: http://template:8080
              predicates:
                - Path=/create
              filters:
                - SetPath=/api/template/create

            - id: template-delete
              uri: http://template:8080
              predicates:
                - Path=/{id}/delete
                - Method=DELETE
              filters:
                - SetPath=/api/template/{id}/delete

            - id: template-all
              uri: http://template:8080
              predicates:
                - Path=/templates
                - Method=GET
              filters:
                - SetPath=/api/template

            - id: template-read
              uri: http://template:8080
              predicates:
                - Path=/templates/{id}
                - Method=GET
              filters:
                - SetPath=/api/template/{id}

            - id: schedule-health
              uri: http://schedule:8080
              predicates:
                - Path=/schedule/health
                - Method=GET
              filters:
                - SetPath=/api/schedule/health

            - id: schedule-set
              uri: http://schedule:8080
              predicates:
                - Path=/schedule/set
                - Method=POST
              filters:
                - SetPath=/api/schedule/set

            - id: schedule-calculate
              uri: http://schedule:8080
              predicates:
                - Path=/schedule/calculate/{count}
                - Method=GET
              filters:
                - SetPath=/api/schedule/calculate/{count}

            - id: auth-refresh
              uri: http://auth:8080
              predicates:
                - Path=/auth/refresh
                - Method=POST
              filters:
                - SetPath=/api/auth/refresh

management:
  endpoints:
    web:
      exposure:
        include: gateway



