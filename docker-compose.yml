services:
  auth:
    build: ./auth
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth
      SPRING_DATASOURCE_USERNAME: ${AUTHDBUSER}
      SPRING_DATASOURCE_PASSWORD: ${AUTHDBPASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-db

  upload:
    build: ./upload
    ports:
      - "8082:8080"
    environment:
      RABBIT_USERNAME: ${RABBITUSER}
      RABBIT_PASSWORD: ${RABBITPASSWORD}
      MINIO_ACCESS_KEY: ${MINIOROOTUSER}
      MINIO_SECRET_KEY: ${MINIOROOTPASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://upload-db:5432/upload
      SPRING_DATASOURCE_USERNAME: ${UPLOADDBUSER}
      SPRING_DATASOURCE_PASSWORD: ${UPLOADDBPASSWORD}
    depends_on:
      - rabbitmq
      - minio
      - upload-db

  video:
    build: ./video
    ports:
      - "8083:8080"
    environment:
      RABBIT_USERNAME: ${RABBITUSER}
      RABBIT_PASSWORD: ${RABBITPASSWORD}
      MINIO_ACCESS_KEY: ${MINIOROOTUSER}
      MINIO_SECRET_KEY: ${MINIOROOTPASSWORD}
    depends_on:
      - rabbitmq
      - minio

  youtube:
    build: ./youtube
    ports:
      - "8084:8080"
    environment:
      RABBIT_USERNAME: ${RABBITUSER}
      RABBIT_PASSWORD: ${RABBITPASSWORD}
      MINIO_ACCESS_KEY: ${MINIOROOTUSER}
      MINIO_SECRET_KEY: ${MINIOROOTPASSWORD}
    depends_on:
      - rabbitmq
      - minio

  minio:
    image: minio/minio:latest
    container_name: minio_server
    ports:
      - "9000:9000"     
      - "9001:9001"       
    volumes:
      - minio_data:/data  
    environment:
      MINIO_ROOT_USER: ${MINIOROOTUSER}
      MINIO_ROOT_PASSWORD: ${MINIOROOTPASSWORD}
    command: server /data --console-address ":9001"
    restart: always

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq_server
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITUSER}
      RABBITMQ_DEFAULT_PASS: ${RABBITPASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  upload-db:
    image: postgres:16
    container_name: upload_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: upload
      POSTGRES_USER: ${UPLOADDBUSER}
      POSTGRES_PASSWORD: ${UPLOADDBPASSWORD}
    volumes:
      - upload_db_data:/var/lib/postgresql/data
    restart: always

  auth-db:
    image: postgres:16
    container_name: auth_db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: ${AUTHDBUSER}
      POSTGRES_PASSWORD: ${AUTHDBPASSWORD}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    restart: always  

volumes:
  minio_data:
  rabbitmq_data:
  upload_db_data:
  auth_db_data: